<!-- Modal تفاصيل المنتج -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content shadow-lg rounded-4">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="productModalLabel">تفاصيل المنتج</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body">
        <div class="row align-items-center">
          <!-- صورة المنتج -->
          <div class="col-md-6 text-center mb-3 mb-md-0">
            <img id="modalProductImage" src="" class="img-fluid rounded-3 border" alt="صورة المنتج" style="max-height: 350px; object-fit: contain;">
          </div>

          <!-- تفاصيل المنتج -->
          <div class="col-md-6">
            <h4 id="modalProductName" class="fw-bold mb-3"></h4>
            <h5 id="modalProductPrice" class="text-success mb-3"></h5>
            <p id="modalProductDescription" class="text-muted"></p>

            <!-- تحديد الكمية -->
            <div class="d-flex align-items-center mb-3" style="max-width: 180px;">
              <button class="btn btn-outline-secondary" type="button" onclick="decreaseQuantity()">-</button>
              <input type="text" id="modalProductQuantity" class="form-control text-center mx-2" value="1" readonly>
              <button class="btn btn-outline-secondary" type="button" onclick="increaseQuantity()">+</button>
            </div>

            <!-- زر الإضافة للعربة -->
            <button id="addToCartButton" class="btn btn-danger w-100 py-2 fs-5">
              <i class="bi bi-cart-plus me-2"></i> أضف إلى العربة
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
