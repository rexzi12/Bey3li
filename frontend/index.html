<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEY3LI - الصفحة الرئيسية</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">


  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="navbar"></div>

<!-- زر وقائمة منسدلة مع أيقونات وأسلوب مميز -->
<div class="container my-3 position-relative">
  <div class="dropdown">
    <button id="newCategoriesButton" class="btn btn-success rounded-pill px-4 py-2 dropdown-toggle">
      <i class="bi bi-list"></i> <span id="selectedCategory">كل الأصناف</span>
    </button>

    <ul id="newCategoriesDropdown" class="dropdown-menu mt-2 animated-dropdown shadow" style="display: none;">
      <!-- العناصر ستتم إضافتها هنا -->
    </ul>
  </div>
</div>


<div id="modalloginContent"></div>

  <!-- هنا سيتم تحميل المودال -->
  <div id="modalContent"></div>


<!-- Hero Section -->
<section class="hero mb-5">
    <div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
      
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="img/hero1.png" class="d-block mx-auto img-fixed" alt="منتجات إلكترونية">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="text-white fw-bold">أفضل الإلكترونيات بأسعار لا تُضاهى!</h2>
          </div>
        </div>
        <div class="carousel-item">
          <img src="img/hero2.png" class="d-block mx-auto img-fixed" alt="أزياء عصرية">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="text-white fw-bold">تسوق أحدث صيحات الموضة العربية!</h2>
          </div>
        </div>
        <div class="carousel-item">
          <img src="img/hero3.png" class="d-block mx-auto img-fixed" alt="منتجات منزلية">
          <div class="carousel-caption d-none d-md-block">
            <h2 class="text-white fw-bold">منتجات منزلية عصرية وجودة عالية</h2>
          </div>
        </div>
      </div>
  
      <!-- Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
  
    </div>
  </section>
  
  <div class="container">
    <h2 class="mb-4 text-center text-primary">منتجات مميزة</h2>
    <div class="row g-4" id="productsContainer">
      <!-- سيتم ملأ المنتجات هنا عبر JavaScript -->
    </div>
  </div>

<div id="footer"></div>

<script src="js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Optional icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>





</body>
</html>
